<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>booksnap</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #12161c; --muted: #6b7480;
    --line: #e3e6ea; --accent: #2f6fed; --auto: #12864b; --auto-bg: #e6f5ec;
    --review: #a3690a; --review-bg: #fdf3e0; --none: #8a9099; --none-bg: #f0f1f3;
    --danger: #c0392b; --danger-bg: #fdeae7; --up: #12864b; --down: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1b1f26; --ink: #e8ebef; --muted: #98a1ad;
      --line: #2b313a; --accent: #6b9bff; --auto: #59d795; --auto-bg: #17331f;
      --review: #e8b45c; --review-bg: #352a15; --none: #8c95a1; --none-bg: #242a32;
      --danger: #ef7a6d; --danger-bg: #3a1f1b; --up: #59d795; --down: #ef7a6d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 19px; margin: 0; letter-spacing: -.2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .layout {
    display: grid; grid-template-columns: minmax(330px, 420px) 1fr;
    gap: 18px; padding: 18px 22px; align-items: start;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  .panel > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0; padding: 12px 14px;
    border-bottom: 1px solid var(--line); display: flex;
    justify-content: space-between; align-items: center; gap: 8px;
  }
  .body { padding: 14px; }

  #drop {
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px 14px;
    text-align: center; color: var(--muted); cursor: pointer; font-size: 14px;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: rgba(47,111,237,.06); }

  button {
    font: inherit; font-size: 14px; padding: 7px 13px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.stop { background: var(--danger); border-color: var(--danger); color: #fff; }
  .linkish {
    border: none; background: none; color: var(--muted); padding: 2px 6px;
    font-size: 13px; text-decoration: underline;
  }
  .linkish:hover { color: var(--danger); }
  input[type=text] {
    font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  select {
    font: inherit; font-size: 13.5px; padding: 6px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    max-width: 100%;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  .img-item {
    display: flex; gap: 10px; align-items: center; padding: 9px 8px;
    border-radius: 9px; border: 1px solid transparent;
  }
  .img-item:hover { background: var(--bg); }
  .img-item.sel { border-color: var(--accent); background: rgba(47,111,237,.07); }
  .img-item img {
    width: 62px; height: 46px; object-fit: cover; border-radius: 6px;
    background: var(--bg); flex: none; cursor: zoom-in;
  }
  .img-meta { min-width: 0; flex: 1; }
  .img-name {
    font-size: 13.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-weight: 500;
  }
  .img-sub { font-size: 12px; color: var(--muted); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px;
    border-radius: 20px; letter-spacing: .02em; white-space: nowrap;
  }
  .b-AUTO   { color: var(--auto);   background: var(--auto-bg); }
  .b-REVIEW { color: var(--review); background: var(--review-bg); }
  .b-none   { color: var(--none);   background: var(--none-bg); }
  .b-WRONG  { color: var(--danger); background: var(--danger-bg); }
  .b-MANUAL { color: var(--accent); background: rgba(47,111,237,.12); }
  .b-EDIT   { color: var(--accent); background: rgba(47,111,237,.12); }

  /* author autocomplete (replaces <datalist>, whose popup the browser placed
     far to the left on these RTL inputs) */
  .ac-pop {
    position: absolute; z-index: 60; display: none;
    direction: rtl; text-align: right;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.18);
    max-height: 236px; overflow-y: auto; padding: 3px;
  }
  .ac-pop > div {
    padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 13.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ac-pop > div:hover, .ac-pop > div.sel { background: rgba(47,111,237,.14); }

  /* "is this book already here?" hint under the add/search box */
  .miss-hint { font-size: 12.5px; line-height: 1.7; margin-top: 2px; }
  .miss-hint .hint-ok   { color: var(--auto);   font-weight: 600; }
  .miss-hint .hint-near { color: var(--review); font-weight: 600; }
  .miss-hint .hint-miss { color: var(--muted); }
  .miss-hint a.hint-jump { color: var(--accent); }
  @keyframes flashrow {
    from { background: rgba(47,111,237,.22); } to { background: transparent; }
  }
  .row.flash { animation: flashrow 1.6s ease-out; }
  .row.rejected img { filter: grayscale(1); opacity: .55; }
  .row.rejected .title { color: var(--muted); text-decoration: line-through; }

  .mode-opt {
    flex: 1; display: flex; gap: 7px; align-items: flex-start; cursor: pointer;
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px;
    font-size: 12px; line-height: 1.35; color: var(--muted);
  }
  .mode-opt:has(input:checked) { border-color: var(--accent); background: rgba(47,111,237,.07); }
  .mode-opt b { color: var(--ink); font-size: 12.5px; }
  .mode-opt input { margin-top: 2px; accent-color: var(--accent); }
  .bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    font-size: 13px; padding: 5px 11px; border-radius: 20px;
    border: 1px solid var(--line); cursor: pointer; background: var(--panel);
    color: var(--muted);
  }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 14px 12px; }
  .stat .n { font-size: 21px; font-weight: 650; }
  .stat .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); }

  .run-item {
    display: flex; gap: 9px; align-items: baseline; padding: 8px;
    border-radius: 9px; cursor: pointer; border: 1px solid transparent;
  }
  .run-item:hover { background: var(--bg); }
  .run-item.on { border-color: var(--accent); background: rgba(47,111,237,.07); }
  .run-no { font-weight: 650; font-size: 13.5px; flex: none; }
  .run-mid { flex: 1; min-width: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }

  .row {
    display: flex; gap: 11px; align-items: center; padding: 9px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row img { height: 44px; width: 32px; object-fit: cover; border-radius: 4px; background: var(--bg); flex: none; }
  .title { font-weight: 550; }
  .rtl { direction: rtl; text-align: right; unicode-bidi: plaintext; }
  .ocr { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 26px 10px; font-size: 14px; }
  .err { color: var(--danger); font-size: 13px; }
  details.prov { margin-top: 10px; }
  details.prov summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  details.prov pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; overflow: auto; max-height: 260px; font-size: 11.5px; margin: 8px 0 0;
  }
  .why-box {
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px; margin: 0 6px 10px; overflow-x: auto;
  }
  table.why-t { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.why-t th {
    text-align: left; color: var(--muted); font-weight: 600; padding: 3px 8px 5px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.why-t td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.why-t tr.rej td { opacity: .72; }
  table.why-t tr.pass td { background: var(--auto-bg); }
  dialog { border: none; border-radius: 12px; padding: 0; max-width: 92vw; background: var(--panel); }
  dialog img { max-width: 90vw; max-height: 85vh; display: block; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
</style>
</head>
<body>

<header>
  <h1>booksnap</h1>
  <span class="sub" id="health"></span>
</header>

<div class="layout">
  <div class="col">
    <!-- ---------------- images ---------------- -->
    <section class="panel">
      <h2><span>Pictures</span><span class="muted" id="imgCount"></span></h2>
      <div class="body">
        <div id="drop">
          <strong>Drop shelf photos here</strong><br>or click to choose files
          <input type="file" id="file" accept="image/*" multiple hidden>
        </div>
        <div class="img-sub" id="phoneHint" style="display:none;margin-top:6px">
          📱 From your phone (same Wi-Fi): open <b id="phoneUrl"></b> —
          you can shoot and upload straight from the camera.
        </div>

        <div style="display:flex;gap:8px;align-items:center;margin:12px 0 6px;flex-wrap:wrap">
          <button class="linkish" id="selAll">select all</button>
          <button class="linkish" id="selNone">clear</button>
          <button class="linkish" id="selNew">only unprocessed</button>
        </div>

        <ul id="imgList"></ul>

        <div style="margin-top:12px">
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:5px">Processing mode</div>
          <div style="display:flex;gap:6px;margin-bottom:10px">
            <label class="mode-opt"><input type="radio" name="mode" value="spines">
              <span><b>Split to spines</b><br>Tesseract per spine, free, ~10s/spine</span></label>
            <label class="mode-opt"><input type="radio" name="mode" value="fullpage">
              <span><b>Whole image</b><br>1 Vision call per photo</span></label>
            <label class="mode-opt"><input type="radio" name="mode" value="llmpage" checked>
              <span><b>LLM read</b><br>Claude reads tiles, ~$0.15/photo</span></label>
          </div>
          <div style="display:flex;gap:8px">
            <button class="primary" id="runBtn" style="flex:1">Run on selected</button>
            <button class="stop" id="stopBtn" style="display:none;flex:1">Stop</button>
          </div>
          <div id="progress" style="display:none;margin-top:10px">
            <div class="img-sub" id="progText"></div>
            <div class="bar"><div id="progBar"></div></div>
          </div>
          <div class="img-sub" style="margin-top:8px" id="modeHint">
            ~10s per spine. Stopping keeps every spine already read.
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------- run history ---------------- -->
    <section class="panel">
      <h2><span>Run history</span><span class="muted" id="runCount"></span></h2>
      <div class="body" style="padding-top:8px">
        <ul id="runList"></ul>
      </div>
    </section>
  </div>

  <!-- ---------------- results ---------------- -->
  <section class="panel">
    <h2>
      <span>Results</span>
      <select id="runSelect" style="text-transform:none;letter-spacing:normal"></select>
    </h2>
    <div class="body" style="padding-bottom:6px">
      <div id="runHead"></div>
      <div class="tabs" id="tabs" style="margin-top:10px"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="body" style="padding-top:0">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
        <label style="font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer">
          <input type="checkbox" id="onlyMatched" checked> matched only
        </label>
        <label style="font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer">
          <input type="checkbox" id="uniqueOnly"> unique titles
        </label>
      </div>
      <div id="results"></div>
    </div>
  </section>
</div>

<dialog id="viewer"><img id="viewerImg" alt=""></dialog>

<script>
const $ = s => document.querySelector(s);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};
const jsonReq = (method, body) => ({
  method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
});
// image names and spine ids go inside attribute selectors; CSS.escape is the
// only correct quoting (a bare "." in "IMG_8139.jpeg" would read as a class)
const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : s;

/** Re-render without the page jumping: rows change height as their controls
 *  change, so the element you were looking at slides away under the cursor.
 *  Pins `selector`'s element to the same viewport offset across `fn`. */
async function keepInPlace(selector, fn) {
  const before = document.querySelector(selector)?.getBoundingClientRect().top;
  await fn();
  const el = document.querySelector(selector);
  if (el && before != null) {
    const delta = el.getBoundingClientRect().top - before;
    if (delta) window.scrollBy(0, delta);
  }
}

let images = [], runs = [], selected = new Set();
let viewRun = null;      // run_id being viewed, null = latest
let tab = 'all', polling = null;
// per-shelf "is it already here?" queries, kept across re-renders so an
// approve/reject elsewhere doesn't wipe what you were checking
const missQueries = {};
let libAuthors = [];     // confirmed-library authors, for author autocomplete

/* ---------------- upload ---------------- */
const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); upload(e.dataTransfer.files); };
fileInput.onchange = () => { upload(fileInput.files); fileInput.value = ''; };

async function upload(fileList) {
  if (!fileList || !fileList.length) return;
  const fd = new FormData();
  for (const f of fileList) fd.append('files', f);
  drop.innerHTML = `<strong>Uploading ${fileList.length} file(s)…</strong>`;
  try {
    const res = await api('/api/images', { method: 'POST', body: fd });
    res.added.forEach(a => selected.add(a.id));
    if (res.rejected.length)
      alert('Skipped:\n' + res.rejected.map(r => `${r.name} — ${r.reason}`).join('\n'));
  } catch (e) { alert('Upload failed: ' + e.message); }
  drop.innerHTML = '<strong>Drop shelf photos here</strong><br>or click to choose files';
  drop.appendChild(fileInput);
  await refresh();
}

/* ---------------- data ---------------- */
async function refresh() {
  [images, runs] = await Promise.all([
    api('/api/images').then(d => d.images),
    api('/api/runs').then(d => d.runs),
  ]);
  const known = new Set(images.map(i => i.id));
  selected = new Set([...selected].filter(id => known.has(id)));
  if (viewRun && !runs.some(r => r.run_id === viewRun)) viewRun = null;
  renderImages(); renderRuns(); renderRunSelect(); await renderResults();
}

/* ---------------- images ---------------- */
function statusBadge(im) {
  if (im.status === 'running') return '<span class="badge b-REVIEW">running</span>';
  if (im.status === 'error')   return '<span class="badge b-none">error</span>';
  const s = im.summary;
  if (s && (im.status === 'done' || im.status === 'stopped'))
    return `${im.status === 'stopped' ? '<span class="badge b-REVIEW">stopped</span> ' : ''}
            <span class="badge b-AUTO">${s.auto} auto</span>
            <span class="badge b-REVIEW">${s.review} review</span>
            <span class="badge b-none">${s.unmatched} none</span>`;
  return '<span class="badge b-none">not processed</span>';
}

function renderImages() {
  $('#imgCount').textContent = images.length ? `${images.length} loaded` : '';
  const list = $('#imgList');
  if (!images.length) { list.innerHTML = '<li class="empty">No pictures yet.</li>'; return; }
  list.innerHTML = '';
  for (const im of images) {
    const li = document.createElement('li');
    li.className = 'img-item' + (selected.has(im.id) ? ' sel' : '');
    li.innerHTML = `
      <input type="checkbox" ${selected.has(im.id) ? 'checked' : ''}>
      <img src="/api/images/${im.id}/thumb" alt="">
      <div class="img-meta">
        <div class="img-name" title="${escapeHtml(im.name)}">${escapeHtml(im.name)}</div>
        <div class="img-sub">${statusBadge(im)}</div>
        ${im.error ? `<div class="err">${escapeHtml(im.error)}</div>` : ''}
      </div>
      <button class="linkish" title="remove">✕</button>`;
    const cb = li.querySelector('input'), thumb = li.querySelector('img'),
          del = li.querySelector('button');
    cb.onchange = () => { cb.checked ? selected.add(im.id) : selected.delete(im.id); renderImages(); };
    thumb.onclick = e => { e.stopPropagation(); showViewer(`/api/images/${im.id}/full`); };
    del.onclick = async e => {
      e.stopPropagation();
      // no confirm() popup — it is silently suppressed in embedded browsers,
      // which made the ✕ appear dead. Two-click inline confirm instead.
      if (del.dataset.armed !== '1') {
        del.dataset.armed = '1';
        del.textContent = 'sure?';
        del.style.color = '#c0392b';
        setTimeout(() => {
          del.dataset.armed = '';
          del.textContent = '✕';
          del.style.color = '';
        }, 3000);
        return;
      }
      try { await api(`/api/images/${im.id}`, { method: 'DELETE' }); await refresh(); }
      catch (err) {
        del.textContent = 'error';
        del.title = err.message;
      }
    };
    li.onclick = e => { if (e.target !== cb) cb.click(); };
    list.appendChild(li);
  }
}

$('#selAll').onclick  = () => { images.forEach(i => selected.add(i.id)); renderImages(); };
$('#selNone').onclick = () => { selected.clear(); renderImages(); };
$('#selNew').onclick  = () => {
  selected = new Set(images.filter(i => i.status !== 'done').map(i => i.id));
  renderImages();
};

/* ---------------- run history ---------------- */
function runTitle(r) {
  const when = new Date(r.started_at).toLocaleString([], {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `#${r.run_no} · ${when}`;
}

function renderRuns() {
  $('#runCount').textContent = runs.length ? `${runs.length} run${runs.length > 1 ? 's' : ''}` : '';
  const list = $('#runList');
  if (!runs.length) { list.innerHTML = '<li class="empty">No runs yet.</li>'; return; }
  const active = viewRun || (runs.find(r => r.totals.spines) || {}).run_id;
  list.innerHTML = '';
  for (const r of runs) {
    const t = r.totals, li = document.createElement('li');
    li.className = 'run-item' + (r.run_id === active ? ' on' : '');
    li.innerHTML = `
      <span class="run-no">#${r.run_no}</span>
      <div class="run-mid">
        <div style="font-size:13px">${escapeHtml(r.label || r.image_names.join(', '))}</div>
        <div class="img-sub">${runTitle(r).split('· ')[1]} ·
          <span class="mono">${r.code_version.sha || '?'}${r.code_version.dirty ? '+' : ''}</span>
          ${r.status !== 'completed' ? ` · <em>${r.status}</em>` : ''}
        </div>
      </div>
      <div style="text-align:right;flex:none">
        <div class="img-sub"><b style="color:var(--auto)">${t.auto}</b>/<b style="color:var(--review)">${t.review}</b>/<span>${t.unmatched}</span></div>
      </div>`;
    li.onclick = () => { viewRun = r.run_id; tab = 'all'; renderRuns(); renderRunSelect(); renderResults(); };
    list.appendChild(li);
  }
}

function renderRunSelect() {
  const sel = $('#runSelect');
  sel.innerHTML = '';
  if (!runs.length) { sel.innerHTML = '<option>no runs</option>'; return; }
  for (const r of runs) {
    const o = document.createElement('option');
    o.value = r.run_id;
    o.textContent = runTitle(r) + (r.label ? ` · ${r.label}` : '') +
                    ` · ${r.totals.auto}A/${r.totals.review}R`;
    sel.appendChild(o);
  }
  sel.value = viewRun || (runs.find(r => r.totals.spines) || runs[0]).run_id;
  sel.onchange = () => { viewRun = sel.value; tab = 'all'; renderRuns(); renderResults(); };
}

/* ---------------- run + stop ---------------- */
$('#runBtn').onclick = async () => {
  if (!selected.size) return alert('Select at least one picture.');
  try {
    const mode = document.querySelector('input[name=mode]:checked').value;
    const r = await api('/api/run', jsonReq('POST', { image_ids: [...selected], mode }));
    viewRun = r.run_id;
    startPolling();
  } catch (e) { alert('Could not start: ' + e.message); }
};

$('#stopBtn').onclick = async () => {
  $('#stopBtn').disabled = true;
  try { await api('/api/stop', { method: 'POST' }); } catch (e) { alert(e.message); }
};

/* the footnote under the Run button must describe the SELECTED mode — the
   "~10s per spine" text only applies to the Tesseract spines path */
const MODE_HINTS = {
  spines: '~10s per spine. Stopping keeps every spine already read.',
  fullpage: 'One Vision call per photo, then each found title is checked ' +
            'against the catalog. Stopping keeps finished images.',
  llmpage: 'Claude reads each photo in parts (~1 min), then each found ' +
           'title is checked against the catalog. Stopping keeps finished images.',
};
function updateModeHint() {
  const m = document.querySelector('input[name=mode]:checked');
  $('#modeHint').textContent = MODE_HINTS[m ? m.value : 'spines'];
}
document.querySelectorAll('input[name=mode]')
  .forEach(r => r.addEventListener('change', updateModeHint));
updateModeHint();

function startPolling() { if (!polling) { polling = setInterval(pollJob, 1200); pollJob(); } }

async function pollJob() {
  let job;
  try { job = await api('/api/job'); } catch { return; }
  const running = job.state === 'running';
  $('#runBtn').style.display = running ? 'none' : '';
  $('#stopBtn').style.display = running ? '' : 'none';
  $('#stopBtn').disabled = !!job.stopping;
  $('#stopBtn').textContent = job.stopping ? 'Stopping after this spine…' : 'Stop';
  $('#progress').style.display = running ? '' : 'none';

  if (running) {
    const done = job.done || 0, tot = job.spines || 0;
    // One continuous bar. LLM/page runs have two long phases per image —
    // reading the photo (tiles), then verifying each found book against the
    // catalog — weighted 50/50 within the image; the bar then advances
    // across images, never restarting from zero.
    let frac = tot ? done / tot : 0, msg = tot ? `spine ${done}/${tot}` : 'segmenting…';
    if (job.phase === 'reading') {
      frac = 0.5 * (tot ? done / tot : 0);
      msg = `reading the photo (part ${done}/${tot})`;
    } else if (job.phase === 'matching') {
      frac = 0.5 + 0.5 * (tot ? done / tot : 0);
      msg = `checking ${tot} found titles against the catalog (${done}/${tot})`;
    } else if (job.phase === 'ocr') {
      msg = `reading block ${done}/${tot}`;
    }
    const nImg = job.image_total || 1, iImg = Math.max(1, job.image_no || 1);
    const overall = ((iImg - 1) + frac) / nImg;
    $('#progText').textContent =
      `Image ${iImg}/${nImg} — ${job.name || ''} · ${msg}`;
    $('#progBar').style.width = `${Math.round(overall * 100)}%`;
    images = (await api('/api/images')).images;
    renderImages();
  } else {
    clearInterval(polling); polling = null;
    await refresh();
  }
}

/* ---------------- results ---------------- */
function renderTabs(run) {
  const tabs = $('#tabs');
  tabs.innerHTML = '';
  if (!run) return;
  const mk = (id, label) => {
    const b = document.createElement('button');
    b.className = 'tab' + (tab === id ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { tab = id; renderResults(); };
    tabs.appendChild(b);
  };
  const ids = Object.keys(run.images || {});
  mk('all', `All images (${ids.length})`);
  ids.forEach(id => {
    const im = images.find(i => i.id === id);
    mk(id, im ? im.name : id);
  });
  if (tab !== 'all' && !ids.includes(tab)) tab = 'all';
}

function deltaEl(cur, prev, key, higherBetter = true) {
  if (!prev) return '';
  const d = cur[key] - (prev.totals[key] ?? 0);
  if (!d) return '';
  const good = higherBetter ? d > 0 : d < 0;
  return `<span class="delta ${good ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</span>`;
}

async function renderResults() {
  const q = new URLSearchParams();
  if (viewRun) q.set('run_id', viewRun);
  if (tab !== 'all') q.set('image_id', tab);
  const data = await api('/api/results?' + q);
  const run = data.run;

  if (!run) {
    $('#runHead').innerHTML = '';
    $('#stats').innerHTML = '';
    $('#tabs').innerHTML = '';
    $('#results').innerHTML = '<div class="empty">No runs yet — upload pictures and run the pipeline.</div>';
    return;
  }

  // previous run, for the delta line
  const idx = runs.findIndex(r => r.run_id === run.run_id);
  const prev = runs.slice(idx + 1).find(r => r.totals.spines);

  const cv = run.code_version || {};
  $('#runHead').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <b>Run #${run.run_no}</b>
      <span class="img-sub">${new Date(run.started_at).toLocaleString()}</span>
      <span class="badge ${run.status === 'completed' ? 'b-AUTO' : 'b-REVIEW'}">${run.status}</span>
      <span class="badge b-none">${escapeHtml(run.mode || 'spines')}</span>
      <span class="mono muted" title="code version">${cv.sha || '?'}${cv.dirty ? '+dirty' : ''}${cv.branch ? ' · ' + cv.branch : ''}</span>
      ${run.duration_s ? `<span class="img-sub">${run.duration_s}s</span>` : ''}
      <span style="flex:1"></span>
      <button class="linkish" id="delRun">delete run</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <input type="text" id="runLabel" placeholder="label this run (e.g. v3: wider token gates)"
             value="${escapeHtml(run.label || '')}" style="flex:1">
      <button id="saveLabel">save</button>
    </div>
    ${prev ? `<div class="img-sub" style="margin-top:6px">compared to run #${prev.run_no}</div>` : ''}
    <details class="prov">
      <summary>run inputs (catalog, config snapshot)</summary>
      <pre>${escapeHtml(JSON.stringify({
        catalog: run.catalog, images: run.image_names,
        per_image: run.images, code_version: cv
      }, null, 1))}</pre>
      <div style="margin-top:6px"><button id="showCfg">show full config snapshot</button></div>
    </details>`;

  $('#delRun').onclick = async () => {
    const b = $('#delRun');           // two-click confirm (see image ✕ note)
    if (b.dataset.armed !== '1') {
      b.dataset.armed = '1';
      b.textContent = `really delete run #${run.run_no}?`;
      b.style.color = '#c0392b';
      setTimeout(() => {
        b.dataset.armed = '';
        b.textContent = 'delete run';
        b.style.color = '';
      }, 3000);
      return;
    }
    await api(`/api/runs/${run.run_id}`, { method: 'DELETE' });
    viewRun = null; await refresh();
  };
  $('#saveLabel').onclick = async () => {
    await api(`/api/runs/${run.run_id}`, jsonReq('PATCH', { label: $('#runLabel').value }));
    await refresh();
  };
  $('#showCfg').onclick = async () => {
    const full = await api(`/api/runs/${run.run_id}`);
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(full.config, null, 1);
    $('#showCfg').replaceWith(pre);
  };

  renderTabs(run);

  // review state for this run + the confirmed library (count + author list
  // for the light autocomplete on author inputs)
  let decisions = {}, libCount = null;
  try { decisions = (await api(`/api/runs/${run.run_id}/decisions`)).decisions || {}; } catch {}
  try {
    const L = await api('/api/library');
    libCount = L.count;
    libAuthors = [...new Set(L.books.map(b => b.author).filter(Boolean))].sort();
  } catch {}

  const t = data.totals;
  $('#stats').innerHTML = [
    ['spines', t.spines, null], ['AUTO', t.auto, 'auto'], ['review', t.review, 'review'],
    ['unmatched', t.unmatched, 'unmatched'], ['unique titles', t.unique_titles, null],
    ...(libCount === null ? [] : [['in library 📚', libCount, null]])
  ].map(([l, n, key]) => `
      <div class="stat">
        <div class="n">${n} ${key && tab === 'all'
          ? deltaEl(t, prev, key, key !== 'unmatched') : ''}</div>
        <div class="l">${l}</div>
      </div>`).join('');

  const box = $('#results');
  if (!t.spines) {
    box.innerHTML = '<div class="empty">This run produced no spines.</div>';
    return;
  }

  if ($('#uniqueOnly').checked) {
    box.innerHTML = data.unique_titles.map(u => `
      <div class="row"><div>
        <div class="title rtl">${escapeHtml(u.title)}</div>
        <div class="ocr rtl">${escapeHtml(u.author || '')}</div>
      </div></div>`).join('') || '<div class="empty">No titles found.</div>';
    return;
  }

  const onlyMatched = $('#onlyMatched').checked;
  const rows = data.found.filter(f => !onlyMatched || f.title);
  const cropUrl = f => `/api/runs/${run.run_id}/crops/${encodeURIComponent(f.spine_id)}`;

  // review controls per claim: ✓ approve · ✗ wrong (ignore) · ⟳ find better.
  // AUTO claims are already in the library ("auto"); ✗ removes them.
  const reviewCell = f => {
    if (!f.title) return '';
    const d = decisions[f.spine_id];
    const sp = escapeHtml(f.spine_id);
    if (d && (d.action === 'approve' || d.action === 'replace' || d.action === 'manual_add')) {
      // (the corrected title is the row's headline — see `effective` below;
      // this cell only carries the state badge and the actions)
      // a confirmed row stays editable: a typo noticed after approving used
      // to need undo-then-fix (owner feedback)
      return `<span class="badge b-AUTO" title="confirmed in library">✓ library</span>
        <button class="linkish rv" data-a="edit" data-spine="${sp}">✎ fix details</button>
        <button class="linkish rv" data-a="reject_ignore" data-spine="${sp}">undo</button>`;
    }
    if (d && d.action === 'reject_ignore') {
      return `<span class="badge b-WRONG">✗ marked wrong</span>
        <button class="linkish rv" data-a="alts" data-spine="${sp}">find better</button>
        <button class="linkish rv" data-a="edit" data-spine="${sp}">✎ fix details</button>
        <button class="linkish rv" data-a="clear" data-spine="${sp}"
                title="mis-click? return to undecided (does not re-add to library)">undo</button>`;
    }
    // no "auto ✓" chip here: the tier badge right above already says AUTO,
    // and a second green chip next to ✓/✗ read as a third state (owner
    // feedback). AUTO rows are library-absorbed silently; ✗ removes.
    return `
      <button class="linkish rv" data-a="approve" data-spine="${sp}">✓ approve</button>
      <button class="linkish rv" data-a="reject_ignore" data-spine="${sp}">✗ wrong</button>
      <button class="linkish rv" data-a="alts" data-spine="${sp}">⟳ find better</button>
      <button class="linkish rv" data-a="edit" data-spine="${sp}">✎ fix details</button>`;
  };

  // a claim the owner marked wrong must READ as wrong: the tier badge keeps
  // its text (you still see it WAS an AUTO) but turns red, and no green
  // appears anywhere on the row — a rejected row wearing a green badge
  // looked like a confirmed book (owner feedback, run 18)
  const isRejected = f => (decisions[f.spine_id] || {}).action === 'reject_ignore';
  // "replace" is the only decision that CHANGES the book (via ✎ fix details
  // or ⟳ find better) — flag it beside the tier so an edited row is
  // distinguishable from an untouched one at a glance
  const isEdited = f => (decisions[f.spine_id] || {}).action === 'replace';
  // What this row IS, now: once a decision approves or rewrites a claim, the
  // library holds the decision's text, so that is the row's headline. The
  // run's original claim stays visible underneath as "was …" — it is the
  // immutable record, but it is history, not the answer (owner feedback: a
  // row fixed to "יער דנקטון חלק א'" still read "יער דנקטון").
  const effective = f => {
    const d = decisions[f.spine_id];
    if (d && ['approve', 'replace', 'manual_add'].includes(d.action) && d.title) {
      return { title: d.title, author: d.author || '',
               changed: d.title !== f.title || (d.author || '') !== (f.author || '') };
    }
    return { title: f.title, author: f.author || '', changed: false };
  };
  const tierBadge = f => `<div style="display:flex;gap:4px;align-items:center">${
    isRejected(f)
      ? `<span class="badge b-WRONG" title="marked wrong">${f.tier || 'none'}</span>`
      : `<span class="badge b-${f.tier || 'none'}">${f.tier || 'none'}</span>`}${
    isEdited(f) ? '<span class="badge b-EDIT" title="title/author changed by hand">✎ edited</span>' : ''
    }</div>`;

  const rowHtml = f => `
    <div class="row${isRejected(f) ? ' rejected' : ''}" data-spine="${escapeHtml(f.spine_id)}">
      <img src="${cropUrl(f)}" alt="" loading="lazy"
           onerror="this.style.visibility='hidden'"
           onclick="showViewer('${cropUrl(f)}')" style="cursor:zoom-in">
      <div style="flex:1;min-width:0">
        ${f.title
          ? `<div class="title rtl">${escapeHtml(effective(f).title)}</div>
             <div class="ocr rtl">${escapeHtml(effective(f).author)}</div>
             ${effective(f).changed
                ? `<div class="ocr rtl" title="what this run matched before you corrected it">was: ${
                    escapeHtml(f.title)}${f.author ? ` — ${escapeHtml(f.author)}` : ''}</div>`
                : ''}`
          : '<div class="muted">— no match —</div>'}
        <div class="ocr rtl" title="raw OCR">${escapeHtml(f.ocr_text || '')}</div>
        <div class="ocr mono" title="${escapeHtml(f.spine_id)}">b${f.band}·s${
          String(f.index).padStart(2, '0')}${
          f.rotation ? ` · ${f.rotation}` : ''}${
          f.ms ? ` · ${(f.ms / 1000).toFixed(1)}s` : ''}${
          f.ocr_score ? ` · score ${f.ocr_score}` : ''}${
          tab === 'all' ? ` · ${escapeHtml(f.image_name)}` : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;max-width:170px">
        ${tierBadge(f)}
        <button class="linkish why" data-spine="${escapeHtml(f.spine_id)}">why?</button>
        ${reviewCell(f)}
      </div>
    </div>
    <div class="why-box" id="why-${escapeHtml(f.spine_id)}" style="display:none"></div>
    <div class="why-box" id="alts-${escapeHtml(f.spine_id)}" style="display:none"></div>`;

  // rows come ordered per image — group them so each shelf gets its own
  // footer: add-a-missing-book + bulk-approve for that shelf's AUTO rows
  const groups = [];
  for (const f of rows) {
    const g = groups[groups.length - 1];
    if (!g || g.name !== f.image_name) groups.push({ name: f.image_name, rows: [f] });
    else g.rows.push(f);
  }
  // bulk-approve eligibility: AUTO rows the owner has NOT decided on — a
  // claim marked wrong must never ride along with an approve-all, and the
  // button's count is exactly the set the click will approve
  const bulkable = g => g.rows.filter(
    f => f.tier === 'AUTO' && f.title && !decisions[f.spine_id]);

  // books added by hand for this shelf render as their own rows, so the
  // addition is visible in place instead of only in the library count
  // (a 'replace' keeps the shelf: editing a hand-added book must not orphan it)
  const manualRows = g => Object.entries(decisions)
    .filter(([, d]) => ['manual_add', 'replace'].includes(d.action)
                       && d.image === g.name)
    .map(([sid, d]) => `
    <div class="row" data-spine="${escapeHtml(sid)}">
      <div style="flex:1;min-width:0">
        <div class="title rtl">${escapeHtml(d.title)}</div>
        <div class="ocr rtl">${escapeHtml(d.author || '')}</div>
        <div class="ocr">added by hand — no spine crop</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;max-width:170px">
        <div style="display:flex;gap:4px;align-items:center">
          <span class="badge b-MANUAL" title="added manually to this shelf">+ manual</span>
          ${d.action === 'replace'
            ? '<span class="badge b-EDIT" title="title/author changed by hand">✎ edited</span>' : ''}
        </div>
        <span class="badge b-AUTO" title="confirmed in library">✓ library</span>
        <button class="linkish man-ed" data-sid="${escapeHtml(sid)}"
                data-t="${escapeHtml(d.title)}" data-a="${escapeHtml(d.author || '')}">✎ fix details</button>
        <button class="linkish man-rm" data-sid="${escapeHtml(sid)}"
                data-t="${escapeHtml(d.title)}" data-a="${escapeHtml(d.author || '')}">✕ remove</button>
      </div>
    </div>
    <div class="why-box" id="alts-${escapeHtml(sid)}" style="display:none"></div>`).join('');

  const groupFooter = (g, gi) => {
    const autos = bulkable(g);
    return `
    <div class="row" data-footer="${escapeHtml(g.name)}" style="align-items:center;gap:8px">
      <div style="flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="img-sub" style="flex-basis:100%">${escapeHtml(g.name)}</span>
        <input type="text" class="rtl miss-t" placeholder="search this run, or add — title"
               data-img="${escapeHtml(g.name)}" value="${escapeHtml(missQueries[g.name] || '')}"
               style="flex:2;min-width:130px">
        <input type="text" class="rtl miss-a authorbox" placeholder="author (optional)" style="flex:1;min-width:100px">
        <button class="miss-add" data-img="${escapeHtml(g.name)}">+ add to library</button>
        ${autos.length ? `<button class="bulk-ok" data-g="${gi}">✓ approve all auto (${autos.length})</button>` : ''}
        <div class="miss-hint" style="flex-basis:100%"></div>
      </div>
    </div>`;
  };
  clearAuthorPopups();              // popups outlive the inputs they anchor to
  box.innerHTML =
    groups.map((g, gi) => g.rows.map(rowHtml).join('') + manualRows(g)
                          + groupFooter(g, gi)).join('')
    || '<div class="empty">Nothing to show with this filter.</div>';
  box.querySelectorAll('input.authorbox').forEach(attachAuthorComplete);

  // "did I miss it?" — the same box that adds a book first tells you whether
  // this run already found it, read it without matching, or the library
  // already holds it. Typing is the query; nothing is added until you click.
  box.querySelectorAll('input.miss-t').forEach(inp => {
    const hint = inp.closest('.row').querySelector('.miss-hint');
    let timer = null, seq = 0;
    const render = (r, strong) => {
      const where = c => c.band === null ? escapeHtml(c.image_name || '')
        : `${escapeHtml(c.image_name || '')} b${c.band}·s${
            String(c.index).padStart(2, '0')}`;
      hint.innerHTML = r.matches.length ? r.matches.map(c => {
        const hit = c.sim >= strong;
        // link only when that row is on screen (another shelf's tab isn't)
        const here = document.querySelector(`.row[data-spine="${c.spine_id}"]`);
        const loc = here ? `<a href="#" class="hint-jump" data-spine="${
          escapeHtml(c.spine_id)}">${where(c)}</a>` : where(c);
        return `<span class="${hit ? 'hint-ok' : 'hint-near'}">${
          hit ? '✓ already listed' : `≈ similar (${c.sim}%)`}</span> ${
          escapeHtml(c.title)}${c.author ? ' — ' + escapeHtml(c.author) : ''}
          <span class="ocr">· ${loc}${c.state ? ' · ' + escapeHtml(c.state) : ''}</span>`;
      }).join('<br>')
        : '<span class="hint-miss">not in this shelf list — add it</span>';
      hint.querySelectorAll('a.hint-jump').forEach(a => {
        a.onclick = ev => {
          ev.preventDefault();
          const row = document.querySelector(
            `.row[data-spine="${a.dataset.spine}"]`);
          if (!row) return;
          row.scrollIntoView({ block: 'center', behavior: 'smooth' });
          row.classList.remove('flash');
          void row.offsetWidth;               // restart the animation
          row.classList.add('flash');
        };
      });
    };
    const search = (delay = 280) => {
      clearTimeout(timer);
      const q = inp.value.trim();
      missQueries[inp.dataset.img] = q;
      if (q.length < 2) { hint.innerHTML = ''; return; }
      timer = setTimeout(async () => {
        const mine = ++seq;                    // ignore out-of-order replies
        hint.innerHTML = '<span class="ocr">searching…</span>';
        try {
          const r = await api(`/api/runs/${run.run_id}/lookup?q=${
            encodeURIComponent(q)}`);
          if (mine === seq) render(r, r.strong);
        } catch { if (mine === seq) hint.innerHTML = ''; }
      }, delay);
    };
    inp.oninput = () => search();
    // a query restored after a re-render should show its answer again
    if (inp.value.trim().length >= 2) search(0);
  });

  box.querySelectorAll('button.miss-add').forEach(b => {
    b.onclick = async () => {
      const wrap = b.closest('.row');
      const title = wrap.querySelector('.miss-t').value.trim();
      if (!title) return;
      await api('/api/review', jsonReq('POST', {
        run_id: run.run_id, spine_id: `manual-${Date.now()}`,
        action: 'manual_add', title, image: b.dataset.img,
        author: wrap.querySelector('.miss-a').value.trim() }));
      delete missQueries[b.dataset.img];      // question answered by adding
      await keepInPlace(`[data-footer="${cssEsc(b.dataset.img)}"]`, renderResults);
      // straight back to the search/add box: adding one missing book usually
      // means adding the next one too
      const next = document.querySelector(
        `input.miss-t[data-img="${cssEsc(b.dataset.img)}"]`);
      if (next) next.focus();
    };
  });
  // a hand-added book is editable like any other row; showEdit only needs
  // {spine_id, title, author}, and the decision it writes keeps the shelf
  box.querySelectorAll('button.man-ed').forEach(b => {
    b.onclick = () => showEdit(run.run_id,
      { spine_id: b.dataset.sid, title: b.dataset.t, author: b.dataset.a },
      decisions[b.dataset.sid]);
  });
  // removing a hand-added book = reject it (deletes the library entry and
  // overwrites the manual_add decision, so the row disappears)
  box.querySelectorAll('button.man-rm').forEach(b => {
    b.onclick = async () => {
      await api('/api/review', jsonReq('POST', {
        run_id: run.run_id, spine_id: b.dataset.sid, action: 'reject_ignore',
        old: { title: b.dataset.t, author: b.dataset.a } }));
      await renderResults();
    };
  });
  box.querySelectorAll('button.bulk-ok').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      // group looked up by the button's own index, not DOM position: a
      // shelf with nothing to approve renders no button, and positional
      // matching then approved the WRONG shelf's rows
      const g = groups[Number(b.dataset.g)];
      for (const f of bulkable(g)) {
        await api('/api/review', jsonReq('POST', {
          run_id: run.run_id, spine_id: f.spine_id, action: 'approve',
          title: f.title, author: f.author || '' }));
      }
      // every approved row loses buttons and shrinks, so the shelf's footer
      // used to jump far up the page — hold it where the eye left it
      await keepInPlace(`[data-footer="${cssEsc(g.name)}"]`, renderResults);
    };
  });

  box.querySelectorAll('button.why').forEach(b => {
    b.onclick = () => showWhy(run.run_id, b.dataset.spine, b);
  });
  box.querySelectorAll('button.rv').forEach(b => {
    const f = rows.find(r => r.spine_id === b.dataset.spine);
    b.onclick = async () => {
      if (b.dataset.a === 'alts') return showAlternatives(run.run_id, f, decisions);
      if (b.dataset.a === 'edit') return showEdit(run.run_id, f, decisions[f.spine_id]);
      const body = { run_id: run.run_id, spine_id: f.spine_id, action: b.dataset.a };
      if (b.dataset.a === 'approve') { body.title = f.title; body.author = f.author || ''; }
      if (b.dataset.a === 'reject_ignore') {
        const d = decisions[f.spine_id];   // undo of replace removes the replacement
        body.old = (d && d.title) ? { title: d.title, author: d.author || '' }
                                  : { title: f.title, author: f.author || '' };
      }
      await api('/api/review', jsonReq('POST', body));
      // the row's controls change height — keep it under the cursor
      await keepInPlace(`.row[data-spine="${cssEsc(f.spine_id)}"]`, renderResults);
    };
  });
}

/* ---------------- author autocomplete ---------------------------------------
   Replaces <datalist>: its popup is positioned by the browser alone, with no
   CSS hook, and on these RIGHT-TO-LEFT inputs it rendered far off to the
   left. This one is a plain absolutely-positioned list anchored to the input.
   It lives on <body> so no ancestor's `overflow: hidden` (the results panel
   has one) can clip it; stale popups are cleared on every results render. */
function clearAuthorPopups() {
  document.querySelectorAll('.ac-pop').forEach(p => p.remove());
}

function attachAuthorComplete(inp) {
  if (!inp) return;
  const pop = document.createElement('div');
  pop.className = 'ac-pop';
  document.body.appendChild(pop);
  let items = [], sel = -1;

  const place = () => {
    const r = inp.getBoundingClientRect();
    pop.style.left = (r.left + window.scrollX) + 'px';
    pop.style.top = (r.bottom + window.scrollY + 2) + 'px';
    pop.style.width = r.width + 'px';
  };
  const hide = () => { pop.style.display = 'none'; sel = -1; };
  const paint = () => {
    pop.innerHTML = items.map((a, i) =>
      `<div class="${i === sel ? 'sel' : ''}" data-i="${i}">${escapeHtml(a)}</div>`).join('');
  };
  const open = () => {
    const q = inp.value.trim();
    items = (q ? libAuthors.filter(a => a.includes(q)) : libAuthors).slice(0, 8);
    if (!items.length) return hide();
    sel = -1;
    paint();
    place();
    pop.style.display = 'block';
  };
  const pick = i => {
    if (i < 0 || i >= items.length) return;
    inp.value = items[i];
    hide();
    inp.focus();
  };

  inp.addEventListener('input', open);
  inp.addEventListener('focus', open);
  inp.addEventListener('blur', () => setTimeout(hide, 120));
  inp.addEventListener('keydown', ev => {
    if (pop.style.display === 'none') return;
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      sel = (sel + 1) % items.length;
      paint();
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      sel = (sel <= 0 ? items.length : sel) - 1;
      paint();
    } else if (ev.key === 'Enter' && sel >= 0) {
      ev.preventDefault();
      pick(sel);
    } else if (ev.key === 'Escape') {
      hide();
    }
  });
  // mousedown, not click: blur fires first on click and would close the list
  pop.addEventListener('mousedown', ev => {
    const d = ev.target.closest('[data-i]');
    if (d) { ev.preventDefault(); pick(+d.dataset.i); }
  });
  window.addEventListener('scroll', () => {
    if (pop.style.display !== 'none') place();
  }, true);
}

/* ---------------- "fix details" — the match is right, the text is off ------ */
function showEdit(runId, f, d) {
  const box = document.getElementById('alts-' + f.spine_id);
  if (box.style.display !== 'none') { box.style.display = 'none'; return; }
  // edit what the row currently SHOWS: after an approve/replace the library
  // holds the decision's text, not the run's original claim, so prefilling
  // (and retracting) the claim would resurrect a title already corrected
  const held = d && ['approve', 'replace', 'manual_add'].includes(d.action) && d.title;
  const curT = held ? d.title : f.title;
  const curA = held ? (d.author || '') : (f.author || '');
  // a rejected row holds nothing in the library — nothing to retract
  const old = (d && d.action === 'reject_ignore') ? {}
                                                  : { title: curT, author: curA };
  box.style.display = '';
  box.innerHTML = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <input type="text" class="rtl" id="edT-${f.spine_id}" value="${escapeHtml(curT)}"
             style="flex:2;min-width:150px" placeholder="title">
      <input type="text" class="rtl authorbox" id="edA-${f.spine_id}" value="${escapeHtml(curA)}"
             style="flex:1;min-width:120px" placeholder="author">
      <button id="edS-${f.spine_id}">save to library</button>
      <button class="linkish" id="edX-${f.spine_id}">✕ cancel</button>
    </div>`;
  attachAuthorComplete(box.querySelector('.authorbox'));
  document.getElementById('edX-' + f.spine_id).onclick = () => { box.style.display = 'none'; };
  document.getElementById('edS-' + f.spine_id).onclick = async () => {
    const title = document.getElementById('edT-' + f.spine_id).value.trim();
    if (!title) return;
    await api('/api/review', jsonReq('POST', {
      run_id: runId, spine_id: f.spine_id, action: 'replace',
      title, author: document.getElementById('edA-' + f.spine_id).value.trim(),
      old }));
    await renderResults();
  };
}

/* ---------------- "find better" alternatives ---------------- */
async function showAlternatives(runId, f, decisions) {
  const box = document.getElementById('alts-' + f.spine_id);
  if (box.style.display !== 'none') { box.style.display = 'none'; return; }
  box.style.display = '';
  box.innerHTML = '<div class="ocr">looking for alternatives…</div>';
  const d = decisions[f.spine_id];
  // exclude by title+author PAIR — excluding by title alone hid a same-title
  // different-author alternative (שהות by Salvatore vs the Stiefvater claim)
  const exclude = JSON.stringify([
    { title: f.title, author: f.author || '' },
    // the book currently on this row (after a correction) is not an
    // "alternative" to itself
    ...(d && d.title ? [{ title: d.title, author: d.author || '' }] : []),
    ...(d && d.rejected_title ? [{ title: d.rejected_title, author: d.rejected_author || '' }] : [])
  ]);
  const r = await api(`/api/runs/${runId}/alternatives/${encodeURIComponent(f.spine_id)}?exclude=${encodeURIComponent(exclude)}`);
  if (!r.candidates.length) {
    box.innerHTML = '<div class="ocr">no other plausible candidate — you can add the right book manually below. <button class="linkish" onclick="this.closest(\'.why-box\').style.display=\'none\'">✕ close</button></div>';
    return;
  }
  box.innerHTML = r.candidates.map((c, i) => `
    <div style="display:flex;gap:8px;align-items:center;padding:3px 0">
      <button class="alt-use" data-i="${i}">use this</button>
      <span class="rtl">${escapeHtml(c.title)} — ${escapeHtml(c.author || '')}</span>
      <span class="muted mono">${c.score}</span>
    </div>`).join('') + `
    <div style="padding:3px 0">
      <button class="linkish" onclick="this.closest('.why-box').style.display='none'">✕ none of these — close</button>
    </div>`;
  box.querySelectorAll('button.alt-use').forEach(b => {
    b.onclick = async () => {
      const c = r.candidates[+b.dataset.i];
      await api('/api/review', jsonReq('POST', {
        run_id: runId, spine_id: f.spine_id, action: 'replace',
        title: c.title, author: c.author || '',
        old: { title: f.title, author: f.author || '' } }));
      await renderResults();
    };
  });
}

$('#onlyMatched').onchange = renderResults;
$('#uniqueOnly').onchange = renderResults;

/* ---------------- why did this match? ---------------- */
async function showWhy(runId, spineId, btn) {
  const box = document.getElementById('why-' + spineId);
  if (box.style.display !== 'none') { box.style.display = 'none'; btn.textContent = 'why?'; return; }
  box.style.display = '';
  btn.textContent = 'hide';
  box.innerHTML = '<div class="ocr">explaining…</div>';
  let d;
  try { d = await api(`/api/runs/${runId}/explain/${encodeURIComponent(spineId)}`); }
  catch (e) { box.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; return; }

  const rows = d.candidates.map(c => `
    <tr class="${c.rejected ? 'rej' : 'pass'}">
      <td class="rtl">${escapeHtml(c.title)}</td>
      <td>${c.rejected ? '—' : c.score.toFixed(1)}</td>
      <td class="rtl">${c.title_hits.map(escapeHtml).join(', ') || '<span class="muted">none</span>'}</td>
      <td>${c.title_sim}</td>
      <td class="rtl">${c.author_hits.map(escapeHtml).join(', ') || ''}</td>
      <td>${c.rejected ? `<span class="muted">${escapeHtml(c.rejected)}</span>` : '<b>accepted</b>'}</td>
    </tr>`).join('');

  box.innerHTML = `
    <div class="ocr" style="margin-bottom:6px">
      query tokens: <span class="rtl mono">${d.query_tokens.map(escapeHtml).join(' · ')}</span>
    </div>
    <table class="why-t">
      <thead><tr><th>candidate</th><th>score</th><th>title hits</th>
                 <th>title&nbsp;sim</th><th>author hits</th><th>verdict</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="muted">no candidate had any title evidence</td></tr>'}</tbody>
    </table>
    <div class="ocr" style="margin-top:6px">
      Recomputed with <b>${escapeHtml(d.explained_with)}</b>
      (${escapeHtml(d.code_version.sha || '?')}${d.code_version.dirty ? '+dirty' : ''}) —
      may differ from what this run stored.
    </div>`;
}

/* ---------------- misc ---------------- */
function showViewer(src) { $('#viewerImg').src = src; $('#viewer').showModal(); }
$('#viewer').onclick = () => $('#viewer').close();

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

(async function init() {
  try {
    const h = await api('/api/health');
    const cv = h.code_version || {};
    const cat = h.catalog_backend === 'nli'
      ? `catalog: NLI${h.nli_key_set ? '' : ' ⚠ no key'}`
      : (h.catalog_exists ? `catalog: ${h.catalog.split(/[\\/]/).pop()}`
                          : `⚠ catalog not found: ${h.catalog}`);
    $('#health').textContent = cat +
      (h.fallback && h.fallback !== 'none' ? ` · vision: on` : ' · vision: off') +
      (cv.sha ? ` · ${cv.sha}${cv.dirty ? '+dirty' : ''}` : '');
    // fullpage needs Vision. Only disable when health *positively* reports it
    // off — an older/unknown response must not silently lock the option out.
    if (h.fallback === 'none') {
      const r = document.querySelector('input[name=mode][value=fullpage]');
      r.disabled = true;
      r.closest('.mode-opt').title = 'needs BOOKSNAP_FALLBACK=google_vision';
      r.closest('.mode-opt').style.opacity = .5;
    }
    if (h.lan_url) {
      $('#phoneUrl').textContent = h.lan_url;
      $('#phoneHint').style.display = '';
    }
    // same only-when-positively-off rule for llmpage; if the default (llm)
    // is unavailable, fall back to the free spines mode
    if (h.anthropic_key_set === false) {
      const r = document.querySelector('input[name=mode][value=llmpage]');
      r.disabled = true;
      r.closest('.mode-opt').title = 'needs ANTHROPIC_API_KEY in .env';
      r.closest('.mode-opt').style.opacity = .5;
      if (r.checked) {
        document.querySelector('input[name=mode][value=spines]').checked = true;
        updateModeHint();
      }
    }
  } catch {}
  await refresh();
  await pollJob();          // reattach to a run already in progress
})();
</script>
