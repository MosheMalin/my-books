<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>booksnap</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header>
  <h1>booksnap</h1>
  <span class="sub" id="health"></span>
</header>

<div class="layout">
  <div class="col">
    <!-- ---------------- images ---------------- -->
    <section class="panel">
      <h2><span>Pictures</span><span class="muted" id="imgCount"></span></h2>
      <div class="body">
        <div id="drop">
          <strong>Drop shelf photos here</strong><br>or click to choose files
          <input type="file" id="file" accept="image/*" multiple hidden>
        </div>
        <div class="img-sub" id="phoneHint" style="display:none;margin-top:6px">
          📱 From your phone (same Wi-Fi): open <b id="phoneUrl"></b> —
          you can shoot and upload straight from the camera.
        </div>

        <div style="display:flex;gap:8px;align-items:center;margin:12px 0 6px;flex-wrap:wrap">
          <button class="linkish" id="selAll">select all</button>
          <button class="linkish" id="selNone">clear</button>
          <button class="linkish" id="selNew">only unprocessed</button>
        </div>

        <ul id="imgList"></ul>

        <div style="margin-top:12px">
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:5px">Processing mode</div>
          <div style="display:flex;gap:6px;margin-bottom:10px">
            <label class="mode-opt"><input type="radio" name="mode" value="spines">
              <span><b>Split to spines</b><br>Tesseract per spine, free, ~10s/spine</span></label>
            <label class="mode-opt"><input type="radio" name="mode" value="fullpage">
              <span><b>Whole image</b><br>1 Vision call per photo</span></label>
            <label class="mode-opt"><input type="radio" name="mode" value="llmpage" checked>
              <span><b>LLM read</b><br>Claude reads tiles, ~$0.15/photo</span></label>
          </div>
          <div style="display:flex;gap:8px">
            <button class="primary" id="runBtn" style="flex:1">Run on selected</button>
            <button class="stop" id="stopBtn" style="display:none;flex:1">Stop</button>
          </div>
          <div id="progress" style="display:none;margin-top:10px">
            <div class="img-sub" id="progText"></div>
            <div class="bar"><div id="progBar"></div></div>
          </div>
          <div class="img-sub" style="margin-top:8px" id="modeHint">
            ~10s per spine. Stopping keeps every spine already read.
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------- run history ---------------- -->
    <section class="panel">
      <h2><span>Run history</span><span class="muted" id="runCount"></span></h2>
      <div class="body" style="padding-top:8px">
        <ul id="runList"></ul>
      </div>
    </section>
  </div>

  <!-- ---------------- results ---------------- -->
  <section class="panel">
    <h2>
      <span>Results</span>
      <select id="runSelect" style="text-transform:none;letter-spacing:normal"></select>
    </h2>
    <div class="body" style="padding-bottom:6px">
      <div id="runHead"></div>
      <div class="tabs" id="tabs" style="margin-top:10px"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="body" style="padding-top:0">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
        <label style="font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer">
          <input type="checkbox" id="onlyMatched" checked> matched only
        </label>
        <label style="font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer">
          <input type="checkbox" id="uniqueOnly"> unique titles
        </label>
      </div>
      <div id="results"></div>
    </div>
  </section>
</div>

<dialog id="viewer"><img id="viewerImg" alt=""></dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
