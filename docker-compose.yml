# booksnap deployment — VPS + Compose (owner, 2026-08-13; VISION §12.3 #10).
#
# Chosen against the alternatives on record: the stack is SQLite + a disk
# blob tree, so a managed PaaS fights the storage model (ephemeral disks) and
# managed cloud services would replace parts that already work and are
# measured. A VPS keeps the restore story to "one directory and one file",
# which is exactly what `tools/restore.py --drill` rehearses.
#
# ⚠ TLS terminates at Caddy, and the API is only reachable through it. That
# is what lets the session cookie become `Secure` — until this compose file
# is what runs, the cookie is deliberately non-Secure, because a Secure
# cookie on plain HTTP is silently dropped and reads as "login did nothing"
# (app/api/routers/auth.py's own note).

services:
  api:
    build:
      context: .
      args:
        # The URL prefix, baked into the client at build time — the SAME
        # variable the runtime env below hands the server. One .env line
        # feeds both; the server refuses a build made for another prefix.
        BOOKSNAP_BASE_PATH: ${BOOKSNAP_BASE_PATH:-/}
    restart: unless-stopped
    environment:
      # The domain the emailed sign-in link must point AT — not localhost,
      # which on the recipient's phone is the recipient's phone (P4.1b's UX
      # review measured exactly that dead end). Under a prefix it carries
      # the prefix too: https://malinvishne.com/booksnap.
      BOOKSNAP_PUBLIC_URL: ${BOOKSNAP_PUBLIC_URL:?set it to https://your.domain}
      # Empty at a domain root; `/booksnap` when the product shares one.
      BOOKSNAP_BASE_PATH: ${BOOKSNAP_BASE_PATH:-}
      # The visitor's address behind the Cloudflare Worker, for the sign-in
      # rate door. Caddy strips this header from anything not arriving from
      # Cloudflare's ranges (deploy/Caddyfile), which is what makes binding
      # it safe HERE and nowhere else.
      BOOKSNAP_VISITOR_HEADER: X-Booksnap-Visitor
      BOOKSNAP_SESSION_SECURE: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NLI_API_KEY: ${NLI_API_KEY:-}
      # Provider sign-in (P4.2): each provider appears on the login screen
      # only when its credentials exist — "configuration decides", so an
      # empty value here is a provider that is ABSENT, not broken. ⚠ The
      # container never sees the host's .env (it is dockerignored, and the
      # composition root's dotenv loader reads the image's own root), so a
      # key that is not listed HERE does not reach the app at all: the first
      # live deploy shipped Google's credentials into .env and the button
      # never appeared. `tests/test_integrations.py` now asserts every
      # BOOKSNAP_* key app/main.py reads is either here or in the Dockerfile.
      BOOKSNAP_GOOGLE_CLIENT_ID: ${BOOKSNAP_GOOGLE_CLIENT_ID:-}
      BOOKSNAP_GOOGLE_CLIENT_SECRET: ${BOOKSNAP_GOOGLE_CLIENT_SECRET:-}
      BOOKSNAP_APPLE_CLIENT_ID: ${BOOKSNAP_APPLE_CLIENT_ID:-}
      BOOKSNAP_APPLE_TEAM_ID: ${BOOKSNAP_APPLE_TEAM_ID:-}
      BOOKSNAP_APPLE_KEY_ID: ${BOOKSNAP_APPLE_KEY_ID:-}
      BOOKSNAP_APPLE_PRIVATE_KEY: ${BOOKSNAP_APPLE_PRIVATE_KEY:-}
      # ⚠ Refusing, not defaulting: with no SMTP host the composition
      # root would bind the DEV mailer, which prints sign-in links to
      # the container log — a live credential for anyone who can read
      # it (P4.4's security review). app/main.py refuses too; this is
      # the door the operator actually meets.
      BOOKSNAP_SMTP_HOST: ${BOOKSNAP_SMTP_HOST:?the deployed mailer must be real -- see .env.example}
      BOOKSNAP_SMTP_PORT: ${BOOKSNAP_SMTP_PORT:-587}
      BOOKSNAP_SMTP_USER: ${BOOKSNAP_SMTP_USER:-}
      BOOKSNAP_SMTP_PASSWORD: ${BOOKSNAP_SMTP_PASSWORD:-}
      BOOKSNAP_MAIL_FROM: ${BOOKSNAP_MAIL_FROM:-}
    volumes:
      - state:/data
    expose:
      - "8757"
    # NOT `ports:` — nothing but Caddy may reach it. The 0.0.0.0 bind inside
    # the container is the container's own network, not the internet.

  staff:
    build: .
    restart: unless-stopped
    # ⚠ The staff service serves EVERY tenant. With no token it serves them
    # to anyone who can reach the port and says so on screen — the owner's
    # deliberate local-dev posture (2026-08-13). Deployed, the token is
    # required, and this file refuses to start without one rather than
    # letting the fail-open default reach the internet.
    environment:
      BOOKSNAP_STAFF_TOKEN: ${BOOKSNAP_STAFF_TOKEN:?the staff service must not be deployed without a token}
    command:
      - uvicorn
      - app.staff_api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8758"
      - --proxy-headers
      # The same rule as the Dockerfile's, for the same reason —
      # inert here (nothing in app/staff_api reads a forwarded header)
      # but a line that disagrees with the reasoning beside it is a
      # line somebody copies.
      - --forwarded-allow-ips
      - "172.16.0.0/12"
    volumes:
      # ⚠ NOT `:ro`, deliberately: app/staff_api/queries.py records that
      # this service opens the file read-WRITE because a WAL database has
      # to create its `-shm` sidecar, and a genuinely read-only mount
      # fails the moment the product is not already holding one open. The
      # service is read-only BY CONSTRUCTION (it has no write path at
      # all), which is a property of the code, not of the mount.
      - state:/data
    # Published on LOOPBACK only, so `ssh -L 8758:localhost:8758` in
    # DEPLOY.md actually reaches it. `expose:` alone put it on the compose
    # network where no tunnel can go — and the fix a frustrated operator
    # reaches for at 3am is `ports: 8758:8758`, which is cross-tenant read
    # access behind one shared token, on the internet.
    ports:
      - "127.0.0.1:8758:8758"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOOKSNAP_DOMAIN: ${BOOKSNAP_DOMAIN:?set it to your.domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # The restore REHEARSAL, on a schedule. Not a backup job with a hope
  # attached: it takes the backup AND proves it restores, and it exits
  # non-zero when it cannot — which is what makes a monitor able to notice.
  backup:
    build: .
    restart: unless-stopped
    # ⚠ No `|| echo`: swallowing the exit code made a silently-failing
    # drill, which is worse than no drill. The container DIES on failure,
    # `restart` brings it back, and the restart loop is what a monitor
    # (or `docker compose ps`) can actually see.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          python tools/backup.py --out /data/backups --keep 14
          python tools/restore.py --drill --from "$$(ls -d /data/backups/* | tail -1)"
          sleep 86400
        done
    volumes:
      - state:/data

volumes:
  state:
  caddy_data:
  caddy_config:
